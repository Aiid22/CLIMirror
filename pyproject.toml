[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climirror"
version = "0.2.0"
description = "Evidence-grounded recovery of CLI command-handler mappings from unpacked firmware"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain>=1.2,<2",
  "langchain-deepseek>=1.0,<2",
  "langchain-mcp-adapters>=0.2,<0.4",
  "mcp>=1.20,<2",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "pyelftools>=0.32,<1",
  "ida-pro-mcp @ git+https://github.com/mrexodia/ida-pro-mcp.git",
]

[project.scripts]
climirror = "climirror.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

